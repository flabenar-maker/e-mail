<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title desc">
  <title id="title">Шесть шагов выпуска письма</title>
  <desc id="desc">Пользователь передаёт задание, Codex исследует макеты, пользователь заполняет форму, возвращает ответы, Codex собирает и проверяет выпуск, сотрудник проверяет его в Альткрафте.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#697386"/></marker></defs>
  <rect width="1000" height="1080" rx="24" fill="#f4f6fa"/>
  <g font-family="Arial, sans-serif" fill="#17233b">
    <text x="50" y="65" font-size="32" font-weight="700">От макета до выпуска письма</text>
    <text x="50" y="104" font-size="20" fill="#4c5b71">Сначала параметры и ссылки, затем сборка и проверка</text>
    <g stroke="#697386" stroke-width="3" marker-end="url(#arrow)"><path d="M500 268V294"/><path d="M500 410V436"/><path d="M500 552V578"/><path d="M500 694V720"/><path d="M500 836V862"/></g>
    <g>
      <rect x="50" y="150" width="900" height="118" rx="16" fill="#fff" stroke="#cbd6e7"/>
      <circle cx="96" cy="196" r="25" fill="#1b61d5"/><text x="88" y="205" fill="#fff" font-size="26">1</text>
      <text x="142" y="193" font-size="23" font-weight="700">Вы передаёте задание</text>
      <text x="142" y="226" font-size="19">Назначение, Mobile / Desktop, папка результата</text>
      <text x="870" y="194" text-anchor="end" font-size="16" fill="#1b61d5">ПОЛЬЗОВАТЕЛЬ</text>
    </g>
    <g>
      <rect x="50" y="294" width="900" height="116" rx="16" fill="#fff" stroke="#cbd6e7"/>
      <circle cx="96" cy="340" r="25" fill="#16375b"/><text x="88" y="349" fill="#fff" font-size="26">2</text>
      <text x="142" y="337" font-size="23" font-weight="700">Codex исследует макеты</text>
      <text x="142" y="370" font-size="19">Распознаёт блоки и действия, выдаёт единую форму</text>
      <text x="870" y="338" text-anchor="end" font-size="16" fill="#16375b">CODEX</text>
    </g>
    <g>
      <rect x="50" y="436" width="900" height="116" rx="16" fill="#fff" stroke="#cbd6e7"/>
      <circle cx="96" cy="482" r="25" fill="#1b61d5"/><text x="88" y="491" fill="#fff" font-size="26">3</text>
      <text x="142" y="479" font-size="23" font-weight="700">Вы заполняете форму</text>
      <text x="142" y="512" font-size="19">Тема, прехедер, настройки отправителя и ссылки</text>
      <text x="870" y="480" text-anchor="end" font-size="16" fill="#1b61d5">ПОЛЬЗОВАТЕЛЬ</text>
    </g>
    <g>
      <rect x="50" y="578" width="900" height="116" rx="16" fill="#fff" stroke="#cbd6e7"/>
      <circle cx="96" cy="624" r="25" fill="#1b61d5"/><text x="88" y="633" fill="#fff" font-size="26">4</text>
      <text x="142" y="621" font-size="23" font-weight="700">Вы возвращаете ответы</text>
      <text x="142" y="654" font-size="19">«Сохранить ответы» → скачать JSON → передать в чат</text>
      <text x="870" y="622" text-anchor="end" font-size="16" fill="#1b61d5">ПОЛЬЗОВАТЕЛЬ</text>
    </g>
    <g>
      <rect x="50" y="720" width="900" height="116" rx="16" fill="#fff" stroke="#cbd6e7"/>
      <circle cx="96" cy="766" r="25" fill="#16375b"/><text x="88" y="775" fill="#fff" font-size="26">5</text>
      <text x="142" y="763" font-size="23" font-weight="700">Codex собирает и проверяет</text>
      <text x="142" y="796" font-size="19">Новая версия: HTML, изображения, ZIP и отчёт</text>
      <text x="870" y="764" text-anchor="end" font-size="16" fill="#16375b">CODEX</text>
    </g>
    <g>
      <rect x="50" y="862" width="900" height="138" rx="16" fill="#eaf4ee" stroke="#bdd8c7"/>
      <circle cx="96" cy="908" r="25" fill="#277449"/><text x="88" y="917" fill="#fff" font-size="26">6</text>
      <text x="142" y="905" font-size="23" font-weight="700">Команда принимает выпуск</text>
      <text x="142" y="938" font-size="19">Просмотр → импорт в Альткрафт → тестовая отправка</text>
      <text x="142" y="969" font-size="19">Результат внешней проверки возвращается в задачу</text>
      <text x="870" y="906" text-anchor="end" font-size="16" fill="#277449">КОМАНДА</text>
    </g>
    <text x="50" y="1046" font-size="18" fill="#4c5b71">Обязательные незаполненные ссылки останавливают окончательный выпуск.</text>
  </g>
</svg>
