name: Temporary refresh generated docs

on:
  push:
    branches: [codex/verify-render-contracts]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore(ci): temporarily refresh generated docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run generate
      - name: Commit only generated registries
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          allowed=(
            docs/generated/asset-registry.md
            docs/generated/component-registry.md
            docs/generated/typography-registry.md
          )
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              docs/generated/asset-registry.md|docs/generated/component-registry.md|docs/generated/typography-registry.md) ;;
              *) echo "Unexpected tracked change: $path" >&2; exit 1 ;;
            esac
          done
          if ((${#changed[@]} == 0)); then
            echo "Generated docs already current."
            exit 0
          fi
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$EXPECTED_SHA" || { echo "Branch advanced; refusing to push." >&2; exit 1; }
          git add -- "${allowed[@]}"
          git diff --cached --quiet && { echo "No staged generated-doc changes."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh generated registries"
          git push origin "HEAD:refs/heads/$BRANCH"