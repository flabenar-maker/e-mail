name: Temporary final validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
  windows-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - shell: pwsh
        run: pwsh -NoProfile -File bootstrap/verify.ps1
      - shell: pwsh
        run: pwsh -NoProfile -File tests/bootstrap-contract.Tests.ps1