              },
              {
                "type": "text",
                "value": "; heading "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-6"
              },
              {
                "type": "text",
                "value": " Bold; body "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-7"
              },
              {
                "type": "text",
                "value": "/140%."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "CTA — instance "
              },
              {
                "type": "component-name",
                "component_id": "button-primary"
              },
              {
                "type": "text",
                "value": ", Viewport=Mobile, full-width."
