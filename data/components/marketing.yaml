            "type": "heading",
            "value": "SCOPE"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Полноширинный footer внутри "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": " email-wrapper. Не помещать в общий email-padding."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "LAYOUT"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Корневой компонент создаёт только внешний отступ перед footer: Mobile "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": ", Desktop "
