          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "CONTENT"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Heading, body и optional "
              },
              {
                "type": "component-name",
                "component_id": "button-secondary"
              },
              {
                "type": "text",
                "value": " остаются HTML. Высота определяется живым контентом; текст не обрезать. Radius и clipping задаёт внешняя карточка."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "MOBILE"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": " сверху: width:100%; height:auto; без HTML-атрибута height; контрольная пропорция "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-4"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Content-area снизу: padding "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-5"
              },
              {
                "type": "text",
                "value": ", gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": ". Text-content gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-6"
              },
              {
                "type": "text",
                "value": "; heading "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-7"
              },
              {
                "type": "text",
                "value": ", body "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-8"
              },
              {
                "type": "text",
                "value": "/140%, по центру. "
              },
              {
                "type": "component-name",
                "component_id": "button-secondary"
              },
              {
                "type": "text",
                "value": " — full-width."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "DESKTOP"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Одна строка общей внутренней шириной "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-9"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Content-area слева: фиксированная ширина "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-10"
              },
              {
                "type": "text",
                "value": ", padding "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-11"
              },
              {
                "type": "text",
                "value": ", внутреннее содержимое "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-12"
              },
              {
                "type": "text",
                "value": ", gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Text-content gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-13"
              },
              {
                "type": "text",
                "value": "; heading "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-14"
              },
              {
                "type": "text",
                "value": " SemiBold, body "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": "/140%, по левому краю. "
              },
              {
                "type": "component-name",
                "component_id": "button-secondary"
              },
              {
                "type": "text",
                "value": " — content-width."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Image-area справа: ширина "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-15"
              },
              {
                "type": "text",
                "value": " и высота всей строки."
              }
