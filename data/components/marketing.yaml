            "value": "SCOPE"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Атомарный составной asset внутри "
              },
              {
                "type": "component-name",
                "component_id": "card-image"
              },
              {
                "type": "text",
                "value": ". HTML-текст карточки в asset не входит."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "SOURCE AND DISPLAY MODES"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Source mode: RENDERED NODE."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Display mode: DIRECT IMAGE."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "VARIANTS"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Style=Plain: только изображение."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Style=Numbered: изображение вместе с видимым слоем Number. Номер является частью итогового JPEG; не верстать его живым HTML и не экспортировать отдельным файлом."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "EXPORT BOUNDARY"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Из конкретного Desktop-инстанса письма экспортировать точный вложенный инстанс “"
              },
              {
                "type": "component-name",
                "component_id": "asset-card-image-2x"
              },
              {
                "type": "text",
                "value": "” после применения Style и всех overrides, включая собственный Fill и все видимые вложенные графические элементы."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Не экспортировать main component, исходный библиотечный вариант или placeholder. Не извлекать только IMAGE Fill и не отделять Number."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Если фактический export boundary содержит presentation-only radius или clipsContent, экспортировать через временную копию того же инстанса с общим и покомпонентными radius 0 и clipsContent=false. Fill, crop, размеры, пропорции, Style, overrides и вложенную графику не изменять. Сначала экспортировать lossless PNG "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": ", затем локально перекодировать его в JPEG по общей инструкции. Временную копию удалить и проверить отсутствие изменений исходного инстанса."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "PROPORTIONS AND RADIUS"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Desktop display: "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": "; итоговый JPEG "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": ": "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": ". Asset остаётся прямоугольным в пропорции "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-4"
              },
              {
                "type": "text",
                "value": ". Скругление "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-5"
              },
              {
                "type": "text",
                "value": " Mobile / "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-6"
              },
              {
                "type": "text",
                "value": " Desktop задаёт clipping-контейнер "
              },
              {
                "type": "component-name",
                "component_id": "card-image"
              },
              {
                "type": "text",
                "value": " в HTML; не запекать скругление или matte-подложку в JPEG."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Использовать один JPEG и один src для Mobile и Desktop."
              }
            ]
          }
        ]
