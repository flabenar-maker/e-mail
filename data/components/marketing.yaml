              },
              {
                "type": "text",
                "value": ", Viewport=Desktop, content-width по содержимому."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "IMAGE "
