              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Text-content: gap "
