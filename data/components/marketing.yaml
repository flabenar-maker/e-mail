              {
                "type": "fact",
                "path": "mobile/root/description-11"
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Из конкретного Desktop-инстанса экспортировать исходный растр из Fill слоя "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-12"
              },
              {
                "type": "text",
                "value": " как один JPEG "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-11"
              },
              {
                "type": "text",
                "value": ". Один файл и один src использовать в Mobile и Desktop."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "На Mobile img остаётся в обычном потоке, получает width:100%; height:auto и формирует высоту image-area; фиксированный height и HTML-атрибут height запрещены."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "На Desktop воспроизвести crop и позицию по Fill выбранного инстанса внутри контейнера "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-8"
              },
              {
                "type": "text",
                "value": " без искажения."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Не приравнивать img одновременно к width и height контейнера. Не использовать VML, пока в инстансе нет текста поверх изображения."
              }
            ]
          }
        ]
