          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "IMAGE ASSET"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Из конкретного Desktop-инстанса экспортировать исходный растр из Fill слоя "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": " как один JPEG "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-16"
              },
              {
                "type": "text",
                "value": ". Один файл и один src использовать в Mobile и Desktop."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "На Mobile изображение остаётся обычным пропорциональным img. На Desktop использовать тот же JPEG как background ячейки: background-size:cover; background-repeat:no-repeat; background-position по Fill Desktop-инстанса. При росте текста изображение пропорционально кропается, но не растягивается. Не преобразовывать блок в Hero."
              }
            ]
          }
