              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Внутри расположен footer-body на всю ширину. Фон footer-body всегда "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-4"
              },
              {
                "type": "text",
                "value": ", без border, shadow и radius. Фон воспроизводить в HTML; отдельный фоновый asset не создавать."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "footer-body:"
              }
            ]
          },
          {
            "type": "bullet",
            "tokens": [
              {
                "type": "text",
                "value": "Mobile: padding 0 "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": " "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": "; gap между видимыми секциями "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": ";"
              }
            ]
          },
          {
            "type": "bullet",
            "tokens": [
              {
                "type": "text",
                "value": "Desktop: padding 0 "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": " "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": "; gap между видимыми секциями "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Межсекционный gap принадлежит footer-body. Если social-section скрыта, не оставлять этот gap или пустой spacer."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "DISCLAIMER"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Порядок видимых элементов:"
              }
            ]
          },
          {
            "type": "ordered",
            "index": 1,
            "tokens": [
              {
                "type": "text",
                "value": "Optional block caption."
              }
            ]
          },
          {
            "type": "ordered",
            "index": 2,
            "tokens": [
              {
                "type": "text",
                "value": "Основной disclaimer paragraph."
              }
            ]
          },
          {
            "type": "ordered",
            "index": 3,
            "tokens": [
              {
                "type": "text",
                "value": "Текст для ошибочного получателя."
              }
            ]
          },
          {
            "type": "ordered",
            "index": 4,
            "tokens": [
              {
                "type": "text",
                "value": "Отдельная unsubscribe link."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "disclaimer-section не добавляет собственного padding."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Gap между её текстовыми элементами: Mobile "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-5"
              },
              {
                "type": "text",
                "value": ", Desktop "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-6"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Текст: Mobile "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-6"
              },
              {
                "type": "text",
                "value": "/140% Regular, Desktop "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-7"
              },
              {
                "type": "text",
                "value": "/140% Regular; "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-8"
              },
              {
                "type": "text",
                "value": ", по центру. Ссылки того же цвета и подчёркнуты. Сохранять только смысловые hard breaks."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "CAPTION"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Boolean-свойство "
              },
              {
                "type": "property-name",
                "property_id": "show-caption"
              },
              {
                "type": "text",
                "value": ", по умолчанию выключено. Если включено, caption становится первым элементом disclaimer-section и использует ту же типографику."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "SOCIAL ICONS"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Boolean-свойство "
              },
              {
                "type": "property-name",
                "property_id": "show-social-links"
              },
              {
                "type": "text",
                "value": " управляет всей social-section. Если выключено, не выводить секцию и не оставлять межсекционный gap."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "social-section не добавляет собственного padding или item gap. Внутри неё находится центрированная группа social-icons:"
              }
            ]
          },
          {
            "type": "bullet",
            "tokens": [
              {
                "type": "text",
                "value": "Mobile: icon "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-9"
              },
              {
                "type": "text",
                "value": "; gap между видимыми иконками "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-5"
              },
              {
                "type": "text",
                "value": ";"
              }
            ]
          },
          {
            "type": "bullet",
            "tokens": [
              {
                "type": "text",
                "value": "Desktop: icon "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-10"
              },
              {
                "type": "text",
                "value": "; gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-6"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "ASSETS"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Экспортировать каждый видимый внешний слой вида “*-icon "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-11"
              },
              {
                "type": "text",
                "value": "” целиком из конкретного Desktop-инстанса как PNG "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-11"
              },
              {
                "type": "text",
                "value": " с прозрачностью. Один src использовать в Mobile и Desktop; display-size задаёт вариант. Скрытые иконки не экспортировать. Не добавлять HTML-подложку."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
