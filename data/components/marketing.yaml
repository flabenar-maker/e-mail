          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Обычный контентный блок внутри общего email-padding."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Top gap: Mobile "
              },
              {
                "type": "fact",
