            "type": "heading",
            "value": "STRUCTURE"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Одна карточка-table: image-area → content-area с живыми HTML heading, optional body и optional CTA. Текст поверх изображения не размещается. Radius и clipping задаёт только внешняя карточка."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "MOBILE"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Image-area занимает 100% доступной ширины; контрольная пропорция "
