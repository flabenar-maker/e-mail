            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Собрать как inline presentation-table или отдельную table-cell с текстом номера шага. Фон, горизонтальный padding и radius задавать на ячейке. Бейдж не растягивать по ширине родителя."
