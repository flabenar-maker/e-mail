      "description": {
        "mode": "rendered",
        "blocks": [
          {
            "type": "heading",
            "value": "SCOPE"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Полноширинная строка внутри "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": " email-wrapper. Не помещать в общий email-padding."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "STRUCTURE"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Одна presentation-table на всю ширину: верхний spacer и центрированная ячейка с логотипом."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Отступ перед логотипом: Mobile "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": ", Desktop "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": ". Дополнительный боковой inset не добавлять."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "FIGMA SOURCES"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Mobile использует вложенный layout-source “header-logo-compact "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-4"
              },
              {
                "type": "text",
                "value": "” размером "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-5"
              },
              {
                "type": "text",
                "value": ". Desktop использует “"
              },
              {
                "type": "fact",
                "path": "mobile/root/description-6"
              },
              {
                "type": "text",
                "value": "” размером "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-7"
              },
              {
                "type": "text",
                "value": ". Раздельные Figma sources нужны только для точного отображения вариантов и не означают два файла письма."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "EXPORT"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Экспортировать только внешний слой “"
              },
              {
                "type": "fact",
                "path": "mobile/root/description-6"
              },
              {
                "type": "text",
                "value": "” из конкретного Desktop-инстанса как PNG "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-4"
              },
              {
                "type": "text",
                "value": ". Он уже содержит логотип и защитную подложку "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-8"
              },
              {
                "type": "text",
                "value": ". Вложенный Product Logo и Mobile layout-source отдельно не экспортировать."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "В HTML использовать один общий файл и один src:"
              }
            ]
          },
          {
            "type": "bullet",
            "tokens": [
              {
                "type": "text",
                "value": "Desktop display: "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-7"
              },
              {
                "type": "text",
                "value": ";"
              }
            ]
          },
          {
            "type": "bullet",
            "tokens": [
              {
                "type": "text",
                "value": "Mobile display: "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-5"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Изображение фиксированное и центрированное; не применять width:100%. Не добавлять отдельный dark-mode asset или HTML-подложку."
              }
            ]
          }
        ]
      },
