        "blocks": [
          {
            "type": "heading",
            "value": "SCOPE"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Обычный контентный блок внутри общего email-padding. Внешний top gap: Mobile "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": ", Desktop "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "CARD"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Единая белая карточка с radius "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": " Mobile / "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-4"
              },
              {
                "type": "text",
                "value": " Desktop. Она состоит из summary-area и details-area, между которыми находится ровно один divider "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-5"
              },
              {
                "type": "text",
                "value": " "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-6"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "SECTION 1 — HEADER"
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Mobile: padding "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": ", gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Desktop: padding "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-7"
              },
              {
                "type": "text",
                "value": ", gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Partner row:"
              }
            ]
          },
          {
            "type": "bullet",
            "tokens": [
              {
                "type": "text",
                "value": "Desktop: горизонтально ["
              },
              {
                "type": "fact",
                "path": "mobile/root/description-8"
              },
              {
                "type": "text",
                "value": " "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-9"
              },
              {
                "type": "text",
                "value": "] → gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": " → text-details → live status badge; все элементы выровнены по вертикальному центру;"
              }
            ]
          },
          {
            "type": "bullet",
            "tokens": [
              {
                "type": "text",
                "value": "Mobile: вертикальный стек по центру ["
              },
              {
                "type": "fact",
                "path": "mobile/root/description-8"
              },
              {
                "type": "text",
                "value": " → text-details → status], gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Partner name, amount и optional description остаются HTML. Описание показывать только при включённом свойстве "
              },
              {
                "type": "property-name",
                "property_id": "show-description"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "SECTION 2 — DETAILS"
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Mobile: padding "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-3"
              },
              {
                "type": "text",
                "value": ", gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-1"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Desktop: padding "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-7"
              },
              {
                "type": "text",
                "value": ", gap "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-2"
              },
              {
                "type": "text",
                "value": "."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Сначала "
              },
              {
                "type": "component-name",
                "component_id": "details-operation"
              },
              {
                "type": "text",
                "value": ", затем optional limit-alert (свойство "
              },
              {
                "type": "property-name",
                "property_id": "show-limit-alert"
              },
              {
                "type": "text",
                "value": "). Внутри "
              },
              {
                "type": "component-name",
                "component_id": "details-operation"
              },
              {
                "type": "text",
                "value": " нет divider между строками; единственный divider компонента разделяет две основные секции."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "ASSETS"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "component-name",
                "component_id": "asset-partner-badge-4x"
              },
              {
                "type": "text",
                "value": " экспортировать целиком из соответствующего слоя конкретного Desktop-инстанса. Использовать один src и display "
              },
              {
                "type": "fact",
                "path": "mobile/root/description-9"
