      "description": {
        "mode": "rendered",
        "blocks": [
          {
            "type": "heading",
            "value": "ROLE"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Корневой assembly-компонент письма. Реализовать ровно один раз как основу общей HTML-структуры, внутри которой размещаются верхнеуровневые библиотечные компоненты."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "VARIANTS"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Viewport=Mobile | Desktop. Для каждой версии письма использовать соответствующий вариант и фактический состав "
              },
              {
                "type": "property-name",
                "property_id": "content"
              },
              {
                "type": "text",
                "value": " в конкретном инстансе. Не переносить состав, свойства или видимость между Mobile и Desktop автоматически."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "ROOT CONTRACT"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "text",
                "value": "Корневую email-обёртку и её техническую HTML-структуру реализовать по глобальной инструкции по вёрстке. Сам "
              },
              {
                "type": "component-name",
                "component_id": "email-template"
              },
              {
                "type": "text",
                "value": " не экспортировать как изображение или отдельный asset."
              }
            ]
          },
          {
            "type": "blank"
          },
          {
            "type": "heading",
            "value": "CONTENT SLOT"
          },
          {
            "type": "line",
            "tokens": [
              {
                "type": "property-name",
                "property_id": "content"
              },
              {
                "type": "text",
                "value": " задаёт порядок и состав верхнеуровневых компонентов письма. Каждый вложенный компонент верстать по его собственному Description. Сам Slot не задаёт самостоятельной визуальной геометрии: не добавлять из-за него отсутствующие в макете padding, gap, background или другие визуальные слои. Не считать Slot запретом на технические table-обёртки, необходимые общей email-структуре."
              }
            ]
          }
        ]
      },
