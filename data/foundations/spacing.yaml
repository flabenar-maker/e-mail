global_invariants:
  - id: one-outer-flow-owner
    statement: Каждый верхнеуровневый компонент получает внешний top spacing ровно
      один раз.
  - id: independent-viewports
    statement: Mobile и Desktop разрешаются независимо.
  - id: exact-component-contract
    statement: Результат design-time фиксируется как одно точное значение в
      component contract.
  - id: build-does-not-resolve
    statement: HTML-вёрстка не применяет spacing foundation и использует только
      фактические component values.
