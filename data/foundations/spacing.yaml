schema_version: 1.0.0
foundation:
  id: spacing
  status: shadow
viewports: [mobile, desktop]
roles:
  - id: outer-flow
    relationship: email-outer-flow
    owner: top-level-component-root
    purpose: Внешний вертикальный ритм верхнеуровневого блока.
    applicability: [top-level]
    resolutions:
      mobile: { value_px: 16, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 24, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Email/Header
        relationship_path: root → logo
      - component: Block/Content
        relationship_path: email flow → block root
      - component: Email/Footer
        relationship_path: previous block → footer root
  - id: common-horizontal-inset
    relationship: email-common-inset
    owner: email-shell
    purpose: Общий боковой inset обычных контентных блоков.
    applicability: [top-level, common-padding]
    resolutions:
      mobile: { value_px: 16, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 24, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Block/Content
        relationship_path: email shell → block root
      - component: Block/Steps
        relationship_path: email shell → block root
  - id: self-horizontal-inset
    relationship: component-self-inset
    owner: top-level-component-root
    purpose: Боковой inset самостоятельного self-inset-компонента.
    applicability: [top-level, self-inset]
    resolutions:
      mobile: { value_px: 16, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 24, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: NPS/Options
        relationship_path: email wrapper → component root
  - id: surface-padding-primary
    relationship: component-container-padding
    owner: component-content-container
    purpose: Padding основной самостоятельной контентной поверхности.
    applicability: [top-level, primary-surface]
    resolutions:
      mobile: { value_px: 22, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 32, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Block/Content
        relationship_path: surface → content
      - component: Banner/Hero
        relationship_path: content-area → content
      - component: Block/Transaction-Success
        relationship_path: surface → sections
  - id: surface-padding-compact
    relationship: component-container-padding
    owner: nested-component
    purpose: Padding вложенной или компактной поверхности.
    applicability: [nested, compact-surface]
    resolutions:
      mobile: { value_px: 16, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 24, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Item/Alert
        relationship_path: nested surface → content
      - component: Banner/Inline
        relationship_path: compact card → content
  - id: section-stack-standard
    relationship: component-section-stack
    owner: component-content-container
    purpose: Основной интервал между крупными секциями внутри поверхности.
    applicability: [top-level, nested]
    resolutions:
      mobile: { value_px: 16, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 24, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Block/Steps
        relationship_path: heading → steps
      - component: Block/Bullet-List
        relationship_path: heading → list
  - id: collection-stack-spacious
    relationship: collection-section-stack
    owner: collection-container
    purpose: Интервал между heading, коллекцией и optional caption.
    applicability: [collection]
    resolutions:
      mobile: { value_px: 22, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 32, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Block/Cards-Images
        relationship_path: heading → cards → caption
      - component: Block/Icon-Cards
        relationship_path: heading → cards → caption
  - id: visual-item-stack
    relationship: repeated-visual-item-stack
    owner: repeated-item-parent
    purpose: Интервал между крупными визуальными карточками.
    applicability: [collection, repeated-items]
    resolutions:
      mobile: { value_px: 22, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 24, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Block/Cards-Images
        relationship_path: card → next card
      - component: Block/Icon-List
        relationship_path: row → next row
  - id: details-row-stack
    relationship: details-row-stack
    owner: details-rows-parent
    purpose: Интервал между строками компактной таблицы реквизитов.
    applicability: [nested, details]
    resolutions:
      mobile: { value_px: 12, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 16, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Details/Receipt
        relationship_path: row → next row
      - component: Details/Operation
        relationship_path: row → next row
  - id: inline-peer-standard
    relationship: inline-peer-gap
    owner: inline-parent
    purpose: Интервал между крупными равноправными элементами композиции.
    applicability: [top-level, nested, inline]
    resolutions:
      mobile: { value_px: 16, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 24, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Block/Transaction-Success
        relationship_path: badge → details → status
      - component: Banner/App-Download
        relationship_path: desktop columns
  - id: inline-peer-compact
    relationship: inline-peer-gap
    owner: inline-parent
    purpose: Интервал между компактными равноправными элементами.
    applicability: [nested, inline, compact]
    resolutions:
      mobile: { value_px: 8, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 12, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Email/Footer
        relationship_path: social icon → next icon
      - component: Banner/App-Download
        relationship_path: store control → next control
  - id: text-stack-standard
    relationship: text-stack
    owner: text-group
    purpose: Обычный интервал между heading, body и caption одной группы.
    applicability: [text]
    resolutions:
      mobile: { value_px: 8, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 12, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Block/Content
        relationship_path: heading → body
      - component: Email/Footer
        relationship_path: disclaimer text stack
  - id: text-stack-tight
    relationship: text-stack
    owner: text-group
    purpose: Интервал между тесно связанными строками одного элемента.
    applicability: [text, compact]
    resolutions:
      mobile: { value_px: 4, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 6, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Item/Bullet
        relationship_path: text line → supporting line
      - component: Block/Instruction-Steps
        relationship_path: list item text stack
  - id: asset-to-content-standard
    relationship: asset-to-content
    owner: asset-content-parent
    purpose: Интервал между крупным semantic asset и живым контентом.
    applicability: [top-level, nested]
    resolutions:
      mobile: { value_px: 16, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 24, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Block/Transaction-Success
        relationship_path: partner badge → content
      - component: Block/Receipt-Info
        relationship_path: status badge → heading
  - id: asset-to-content-compact
    relationship: asset-to-content
    owner: asset-content-parent
    purpose: Интервал между компактным asset и живым контентом.
    applicability: [nested, compact]
    resolutions:
      mobile: { value_px: 8, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
      desktop: { value_px: 12, provenance: { kind: registry-literal, source_blob_sha: be2203aef82db093fca37857f060d552b254c579 } }
    evidence:
      - component: Item/Bullet
        relationship_path: bullet → text
      - component: Banner/App-Download
        relationship_path: store icon → text
global_invariants:
  - id: one-outer-flow-owner
    statement: Каждый верхнеуровневый компонент получает внешний top spacing ровно один раз.
  - id: independent-viewports
    statement: Mobile и Desktop разрешаются независимо.
  - id: exact-component-contract
    statement: Результат design-time фиксируется как одно точное значение в component contract.
  - id: build-does-not-resolve
    statement: HTML-вёрстка не применяет spacing foundation и использует только фактические component values.
exceptions: []
provenance:
