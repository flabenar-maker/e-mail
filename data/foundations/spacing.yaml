    owner: details-rows-parent
    purpose: Интервал между строками компактной таблицы реквизитов.
    applicability: [nested, details]
    resolutions:
      mobile: { value_px: 12, provenance: { kind: registry-literal, source_path: registry/email-component-descriptions-registry.md } }
      desktop: { value_px: 16, provenance: { kind: registry-literal, source_path: registry/email-component-descriptions-registry.md } }
