      required_foundation_ids: []
  - id: email-new-build
    source_ids: [repository-readme, figma-library-standard, email-rendering-standard, email-model-assembly-standard, email-model-schema, component-contract-standard, typography-standard, asset-export-standard, rendering-foundation, renderer-registry, workflow-paused]
