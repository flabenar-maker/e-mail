schema_version: 1.1.0
system:
  id: cupis-email-system
  repository: flabenar-maker/e-mail
entrypoints:
  repository: README.md
  bootstrap: bootstrap/README.md
sources:
  - { id: repository-readme, kind: entrypoint, path: README.md }
  - { id: bootstrap-readme, kind: entrypoint, path: bootstrap/README.md }
  - { id: migration-roadmap, kind: entrypoint, path: docs/superpowers/plans/2026-08-25-cupis-migration-roadmap.md }
  - { id: email-figma-prompt, kind: core, path: core/email-figma-prompt.md }
  - { id: figma-component-naming-standard, kind: core, path: core/figma-component-naming-standard.md }
  - { id: component-contract-standard, kind: core, path: core/component-contract-standard.md }
  - { id: figma-component-description-standard, kind: core, path: core/figma-component-description-standard.md }
  - { id: component-descriptions-registry, kind: registry, path: registry/email-component-descriptions-registry.md }
  - { id: typography-registry, kind: registry, path: registry/email-typography-registry.md }
  - { id: library-maintenance-checkpoint, kind: workflow, path: workflows/library-maintenance-checkpoint.md }
  - { id: email-build-checkpoint, kind: workflow, path: workflows/email-build-checkpoint.md }
  - { id: email-project-brief, kind: template, path: templates/email-project-brief.md }
  - { id: manifest-schema, kind: schema, path: schemas/manifest.schema.json }
  - { id: typography-foundation, kind: registry, path: data/foundations/typography.yaml }
  - { id: typography-schema, kind: schema, path: schemas/typography.schema.json }
  - { id: spacing-foundation, kind: registry, path: data/foundations/spacing.yaml }
  - { id: spacing-schema, kind: schema, path: schemas/spacing.schema.json }
  - { id: assets-foundation, kind: registry, path: data/foundations/assets.yaml }
  - { id: assets-schema, kind: schema, path: schemas/assets.schema.json }
  - { id: figma-naming-foundation, kind: registry, path: data/foundations/figma-naming.yaml }
  - { id: figma-naming-schema, kind: schema, path: schemas/figma-naming.schema.json }
  - { id: rendering-foundation, kind: registry, path: data/foundations/rendering.yaml }
  - { id: rendering-schema, kind: schema, path: schemas/rendering.schema.json }
  - { id: components-shared, kind: registry, path: data/components/shared.yaml }
  - { id: components-marketing, kind: registry, path: data/components/marketing.yaml }
  - { id: components-service, kind: registry, path: data/components/service.yaml }
  - { id: components-schema, kind: schema, path: schemas/components.schema.json }
  - { id: generated-component-registry, kind: generated, path: docs/generated/component-registry.md }
  - { id: generated-typography-registry, kind: generated, path: docs/generated/typography-registry.md }
  - { id: generated-asset-registry, kind: generated, path: docs/generated/asset-registry.md }
  - { id: generated-naming-reference, kind: generated, path: docs/generated/naming-reference.md }
generated_docs:
  - id: component-registry
    output_source_id: generated-component-registry
    renderer: component-registry
    input_source_ids: [components-shared, components-marketing, components-service, components-schema, typography-foundation, typography-schema, spacing-foundation, spacing-schema, assets-foundation, assets-schema]
  - id: typography-registry
    output_source_id: generated-typography-registry
    renderer: typography-registry
    input_source_ids: [typography-foundation, typography-schema, components-shared, components-marketing, components-service, components-schema]
  - id: asset-registry
    output_source_id: generated-asset-registry
    renderer: asset-registry
    input_source_ids: [assets-foundation, assets-schema, components-shared, components-marketing, components-service, components-schema]
  - id: naming-reference
    output_source_id: generated-naming-reference
    renderer: naming-reference
    input_source_ids: [figma-naming-foundation, figma-naming-schema]
bundle_profiles:
  - id: library-maintenance
    source_ids: [repository-readme, email-figma-prompt, figma-component-naming-standard, component-descriptions-registry, typography-registry, spacing-foundation, library-maintenance-checkpoint]
    generated_bundle:
      status: shadow
      static_source_ids: [repository-readme, email-figma-prompt, figma-component-naming-standard, library-maintenance-checkpoint]
      component_selection: optional
      viewport_selection: one-or-both
      foundation_selection: explicit-or-referenced
      allowed_foundation_ids: [typography, spacing, assets, figma-naming]
      required_foundation_ids: []
  - id: component-onboarding
    source_ids: [repository-readme, email-figma-prompt, figma-component-naming-standard, component-descriptions-registry, typography-registry, spacing-foundation, library-maintenance-checkpoint]
    generated_bundle:
      status: shadow
      static_source_ids: [repository-readme, email-figma-prompt, figma-component-naming-standard, library-maintenance-checkpoint]
      component_selection: optional
      viewport_selection: both
      foundation_selection: explicit-or-referenced
      allowed_foundation_ids: [typography, spacing, assets, figma-naming]
      required_foundation_ids: []
  - id: figma-description-sync
    source_ids: [repository-readme, email-figma-prompt, component-descriptions-registry, typography-registry, library-maintenance-checkpoint]
    generated_bundle:
      status: shadow
      static_source_ids: [repository-readme, email-figma-prompt, library-maintenance-checkpoint]
      component_selection: required
      viewport_selection: both
      foundation_selection: referenced
      allowed_foundation_ids: [typography, spacing, assets]
      required_foundation_ids: []
  - id: figma-naming-audit
    source_ids: [repository-readme, figma-component-naming-standard, component-descriptions-registry, library-maintenance-checkpoint]
    generated_bundle:
      status: shadow
      static_source_ids: [repository-readme, figma-component-naming-standard, library-maintenance-checkpoint]
      component_selection: optional
      viewport_selection: none
      foundation_selection: explicit
      allowed_foundation_ids: [figma-naming]
      required_foundation_ids: [figma-naming]
  - id: migration-progress
    source_ids: [repository-readme, migration-roadmap, library-maintenance-checkpoint]
    generated_bundle:
      status: shadow
      static_source_ids: [repository-readme, migration-roadmap, library-maintenance-checkpoint]
      component_selection: none
      viewport_selection: none
      foundation_selection: none
      allowed_foundation_ids: []
      required_foundation_ids: []
  - id: email-new-build
    source_ids: [repository-readme, email-figma-prompt, figma-component-naming-standard, component-descriptions-registry, typography-registry, email-build-checkpoint, email-project-brief]
    generated_bundle:
      status: shadow
      static_source_ids: [repository-readme, email-figma-prompt, email-build-checkpoint, email-project-brief]
      component_selection: required
      viewport_selection: both
      foundation_selection: referenced
      allowed_foundation_ids: [typography, spacing, assets]
      required_foundation_ids: []
  - id: email-continue-fix
    source_ids: [repository-readme, email-figma-prompt, figma-component-naming-standard, component-descriptions-registry, typography-registry, email-build-checkpoint]
    generated_bundle:
      status: shadow
      static_source_ids: [repository-readme, email-figma-prompt, email-build-checkpoint]
      component_selection: optional
      viewport_selection: both-when-components
      foundation_selection: referenced
      allowed_foundation_ids: [typography, spacing, assets]
      required_foundation_ids: []
routes:
  - { id: library-maintenance, workflow_source_id: library-maintenance-checkpoint, bundle_profile_id: library-maintenance }
  - { id: component-onboarding, workflow_source_id: library-maintenance-checkpoint, bundle_profile_id: component-onboarding }
  - { id: figma-description-sync, workflow_source_id: library-maintenance-checkpoint, bundle_profile_id: figma-description-sync }
  - { id: figma-naming-audit, workflow_source_id: library-maintenance-checkpoint, bundle_profile_id: figma-naming-audit }
  - { id: migration-progress, workflow_source_id: library-maintenance-checkpoint, bundle_profile_id: migration-progress }
  - { id: email-new-build, workflow_source_id: email-build-checkpoint, bundle_profile_id: email-new-build }
  - { id: email-continue-fix, workflow_source_id: email-build-checkpoint, bundle_profile_id: email-continue-fix }
skills:
  required:
    - { id: maintaining-cupis-email-system, path: .agents/skills/maintaining-cupis-email-system }
  optional: []
plugins:
  required: [figma@openai-curated-remote, github@openai-curated-remote]
  optional: [superpowers@openai-curated-remote]
figma:
  file_key: 8zka5bHkcrJVK9I9dKjnhC
  roots: { marketing: "538:17236", service: "538:17235" }
bootstrap:
  portable_config: bootstrap/config.portable.toml
  verifier: bootstrap/verify.ps1
commands:
  validate: npm run validate
  test: npm test
  verify: npm run verify