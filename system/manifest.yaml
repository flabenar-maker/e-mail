      status: structured-shadow
      static_source_ids: [repository-readme, figma-library-standard, workflow-paused]
      component_selection: optional
      viewport_selection: none
      foundation_selection: explicit
      allowed_foundation_ids: [figma-naming]
      required_foundation_ids: [figma-naming]
  - id: migration-progress
    source_ids: [repository-readme, migration-roadmap, workflow-paused]
    generated_bundle:
      status: structured-shadow
      static_source_ids: [repository-readme, migration-roadmap, workflow-paused]
      component_selection: none
      viewport_selection: none
      foundation_selection: none
